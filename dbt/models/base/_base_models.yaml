version: 2

models:
  - name: base_spotify__last_songs
    description: "Base model for data from spotify_last_songs."
    columns:
      - name: spotify_last_songs_id
        description: "Unique identifier for the last song."
        tests:
          - unique
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_last_songs_updated_at
        description: "Timestamp of the last update for the song."
        tests:
          - not_null
        meta:
          dimension:
            type: timestamp
      - name: spotify_last_songs_track_played_at
        description: "Timestamp when the track was played."
        tests:
          - not_null
        meta:
          dimension:
            type: timestamp
      - name: spotify_last_songs_artist_name
        description: "Name of the artist of the last song."
        tests:
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_last_songs_track_name
        description: "Name of the track."
        tests:
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_last_songs_track_id
        description: "Identifier for the track that was played."
        tests:
          - not_null
        meta:
          dimension:
            type: string
  
  - name: base_spotify__old_songs
    description: "Base model for data from spotify_old_songs."
    columns:
      - name: spotify_old_songs_id
        description: "Unique identifier for the old song."
        tests:
          - unique
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_old_songs_updated_at
        description: "Timestamp of the last update for the old song."
        tests:
          - not_null
        meta:
          dimension:
            type: timestamp
      - name: spotify_old_songs_started_playing_at
        description: "Timestamp when the song started playing."
        tests:
          - not_null
        meta:
          dimension:
            type: timestamp
      - name: spotify_old_songs_artist_name
        description: "Name of the artist of the old song."
        tests:
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_old_songs_track_name
        description: "Name of the track."
        tests:
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_old_songs_album_name
        description: "Name of the album."
        tests:
          - not_null
        meta:
          dimension:
            type: string
      - name: spotify_old_songs_ms_played
        description: "Milliseconds the song was played."
        tests:
          - not_null
        meta:
          dimension:
            type: number
      - name: spotify_old_songs_reason_start
        description: "Reason why the song started playing."
        meta:
          dimension:
            type: string
      - name: spotify_old_songs_reason_end
        description: "Reason why the song stopped playing."
        meta:
          dimension:
            type: string
      - name: spotify_old_songs_shuffle
        description: "Whether shuffle was enabled."
        meta:
          dimension:
            type: boolean
      - name: spotify_old_songs_skipped
        description: "Whether the song was skipped."
        meta:
          dimension:
            type: boolean
      - name: spotify_old_songs_offline
        description: "Whether the song was played offline."
        meta:
          dimension:
            type: boolean
      - name: spotify_old_songs_track_id
        description: "Identifier for the track that was played."
        tests:
          - not_null
        meta:
          dimension:
            type: string